spring.application.name=obsidian
server.port=8084

# Honor X-Forwarded-Proto from the nginx TLS edge so the session cookie
# is marked Secure and any redirects use https.
server.forward-headers-strategy=framework

# Logging — DEBUG for app classes, INFO for everything else
logging.level.com.obsidian=DEBUG
logging.level.root=INFO

# Auth — real values come from .env via docker-compose (APP_AUTH_*).
# The defaults below exist only so local runs and tests can boot.
app.auth.username=${APP_AUTH_USERNAME:admin}
app.auth.password=${APP_AUTH_PASSWORD:changeme-local}

# Remember-me signing key. MUST be STABLE across restarts — Spring generates a RANDOM key
# when unset, which invalidates every long-lived token on each boot (exactly the re-login
# churn we're fixing). Real value from .env (APP_AUTH_REMEMBER_KEY); the default lets local
# runs/tests boot. Token validity below = 365 days (sign in ~once a year).
app.auth.remember-key=${APP_AUTH_REMEMBER_KEY:obsopt-local-remember-me-key-set-in-env}
app.auth.remember-validity-seconds=${APP_AUTH_REMEMBER_VALIDITY_SECONDS:31536000}

# Datasource — overridden by SPRING_DATASOURCE_* env vars in Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/obsidian
spring.datasource.username=obsidian
spring.datasource.password=obsidian

embedder.url=${EMBEDDER_URL:http://localhost:8000}
wrapper.url=${WRAPPER_URL:http://host.docker.internal:5001}

# Image worker: concurrent requests to the wrapper — size ≈ number of
# configured vision providers in the LLM router (host-wrapper/llm_router.py)
image.worker.parallelism=${IMAGE_WORKER_PARALLELISM:4}

# Allow large file uploads (images, videos, PDFs pasted into notes)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Sync / Google Drive — env vars are the headless bootstrap only; the Settings UI
# (app_settings: syncPassphrase, syncClientId, syncClientSecret, sync.drive.folder_id)
# owns the values afterwards. GOOGLE_DRIVE_FOLDER_ID / SYNC_PASSPHRASE are seeded into
# app_settings by SettingsRepository on first boot.
sync.passphrase=${SYNC_PASSPHRASE:}
sync.google.service-account-json=${GOOGLE_SERVICE_ACCOUNT_JSON:placeholder}
sync.upload.cron=${SYNC_UPLOAD_CRON:0 0 */6 * * *}
sync.janitor.cron=${SYNC_JANITOR_CRON:0 0 4 * * SUN}
