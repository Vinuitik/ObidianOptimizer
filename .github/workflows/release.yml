name: Release

# Tag v* -> multi-arch images on GHCR + bundle files and manifest.json on the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the Release + upload assets
  packages: write   # push to GHCR

env:
  REGISTRY: ghcr.io
  PREFIX: ghcr.io/vinuitik/obsidian-optimizer

jobs:
  images:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: obsidian_optimizer/obsidian
            platforms: linux/amd64,linux/arm64
            suffix: ""
            build_args: ""
          - name: frontend
            context: frontend
            platforms: linux/amd64,linux/arm64
            suffix: ""
            build_args: ""
          - name: llm
            context: host-wrapper
            platforms: linux/amd64,linux/arm64
            suffix: ""
            build_args: ""
          # CPU embedder (default for the user bundle, runs on Apple Silicon too)
          - name: embedder
            context: embedder
            platforms: linux/amd64,linux/arm64
            suffix: ""
            build_args: |
              BASE_IMAGE=ubuntu:22.04
              GPU=0
          # CUDA embedder (compose.gpu.yml overlay) — amd64 only
          - name: embedder
            context: embedder
            platforms: linux/amd64
            suffix: "-gpu"
            build_args: |
              GPU=1
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.PREFIX }}-${{ matrix.name }}:${{ steps.v.outputs.version }}${{ matrix.suffix }}
            ${{ env.PREFIX }}-${{ matrix.name }}:latest${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.name }}${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}${{ matrix.suffix }}

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p out
          sed "s/@VERSION@/${VERSION}/g" bundle/manifest.template.json > out/manifest.json
          python3 -c "import json; json.load(open('out/manifest.json'))"
          cp bundle/compose.yml bundle/compose.gpu.yml bundle/.env.template out/
          cat out/manifest.json

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/manifest.json
            out/compose.yml
            out/compose.gpu.yml
            out/.env.template
