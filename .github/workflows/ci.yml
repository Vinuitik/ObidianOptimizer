name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  # ── Backend unit tests (no Docker needed) ──────────────────────────────────
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian_optimizer/obsidian

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run unit tests (excludes *IT.java)
        run: mvn test -Dtest="!*IT" -pl . --no-transfer-progress

  # ── Backend integration tests (Testcontainers pulls postgres:16) ──────────
  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian_optimizer/obsidian

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run integration tests (*IT.java only)
        run: mvn test -Dtest="*IT" -pl . --no-transfer-progress
        env:
          # Testcontainers needs Docker — GitHub-hosted ubuntu runners have it
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # ── Frontend unit tests ───────────────────────────────────────────────────
  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  # ── Docker build smoke-test ───────────────────────────────────────────────
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build images (no push)
        run: docker compose build
        env:
          COMPOSE_DOCKER_CLI_BUILD: "1"
          DOCKER_BUILDKIT: "1"
