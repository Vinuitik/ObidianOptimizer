name: launcher-release
# On tag v*: build the desktop launcher for Win / Linux / mac and attach to the GitHub Release.
# (release.yml owns images + manifest; this only adds launcher installers.)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            glob: desktop/release/*.exe
          - os: ubuntu-latest
            script: dist:linux
            glob: desktop/release/*.AppImage
          - os: macos-latest
            script: dist:mac
            glob: |
              desktop/release/*.dmg
              desktop/release/*.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # mac: ad-hoc signing only (identity "-"), no notarization
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.glob }}
