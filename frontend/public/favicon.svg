<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 42">
  <defs>
    <linearGradient id="r1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4d8f"/>
      <stop offset="100%" stop-color="#2c2547"/>
    </linearGradient>
    <linearGradient id="r2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#221d36"/>
      <stop offset="100%" stop-color="#100d1c"/>
    </linearGradient>
    <linearGradient id="spec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8b8ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- top-left facet -->
  <polygon points="16,0 0,15.1 16,18.5" fill="url(#r1)"/>
  <!-- top-right facet -->
  <polygon points="16,0 32,15.1 16,18.5" fill="url(#r2)"/>
  <!-- bottom-left facet -->
  <polygon points="0,15.1 16,18.5 7.7,42" fill="#151122"/>
  <!-- bottom-right facet -->
  <polygon points="32,15.1 16,18.5 24.3,42" fill="#0a0810"/>
