# TLS-terminating edge for the whole stack. Backend/postgres/embedder are not
# directly exposed (loopback-only binds in docker-compose) — everything browser-
# facing flows through here.

# Rate-limit zones (this file is included in the http context, so these are legal here)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;

# Plain HTTP → HTTPS redirect
server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    # Self-signed by default — generated by start.ps1 into ./certs (gitignored).
    # Replace with a CA-issued pair when serving a real domain.
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # style-src 'unsafe-inline': Milkdown/Framer Motion set inline styles.
    # img/media blob:: pasted-but-unsaved files are previewed via blob URLs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # NO HSTS on purpose: self-signed cert on localhost. HSTS would pin the
    # browser to HTTPS for every localhost service. Add it only behind a real
    # domain with a CA cert.

    # CACHE DISABLED: remove when re-enabling caching
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # ── Auth endpoint — strict brute-force limit (5/min per IP) ──────────────
    # NOTE: add_header directives do NOT inherit into locations that declare
    # their own add_header — none here do, so server-level headers apply.
    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass         http://backend:8084/login;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass         http://backend:8084/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 100m;   # match Spring multipart limit; nginx default (1m) would 413 uploads
    }

    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
    }
}
