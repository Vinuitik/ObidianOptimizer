services:
  postgres:
    # paradedb/paradedb ships PostgreSQL 16 + pgvector (<=> cosine) + pg_search
    # (BM25 via Tantivy, @@@). No custom build needed — used to be ./db/Dockerfile.
    image: paradedb/paradedb:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: obsidian
      POSTGRES_USER: obsidian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obsidian}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5435:5432"   # loopback only — host psql works, LAN cannot reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsidian"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Transactional-outbox broker for Group A (see architecture_plans/QUEUE_UNIFICATION_PLAN.md
  # Phase 3). No host ports on purpose: reachable only from `backend` by service name over
  # the internal compose network — avoids colliding with an unrelated RabbitMQ container
  # already running on this host for a different project.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  embedder:
    build: ./embedder
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # loopback only — MCP clients run on this machine
    volumes:
      - embedder_models:/models
      - ${HOST_VAULT_PATH}:/vault:ro
      # Agent debug reports (flashcards, ingest, …): /vault is read-only, so this
      # writable bind to the vault's _reports/ subdir is where AgentReport writes.
      # _reports is in the retrieval ignore lists (FileRepository.EXCLUDED_DIRS +
      # embedder os.walk prune) so it's never scanned/embedded/carded.
      - ${HOST_VAULT_PATH}/_reports:/reports
      # Offline downloads (yt-dlp) land in the vault's _workspace/ so they show up
      # directly in the Learn page (ResourcePanel + nginx read _workspace). /vault is
      # read-only, so this writable bind to the _workspace subdir is what yt-dlp writes
      # through (DOWNLOAD_DIR=/workspace below). Replaces the old ./downloads mount.
      - ${HOST_VAULT_PATH}/_workspace:/workspace
      # Permanent media store: ingest downloads video/audio/PDF here so notes can play
      # the LOCAL file (LOCAL_MEDIA_RETENTION stage 2). /vault is :ro, so — same pattern
      # as _workspace/_reports — this dedicated writable sub-bind is the embedder's door
      # into resources/ (RESOURCE_DIR=/resources below). nginx serves it at /vault-media/.
      - ${HOST_VAULT_PATH}/resources:/resources
    environment:
      - EMBED_MODEL=${EMBED_MODEL:-onnx-community/embeddinggemma-300m-ONNX}
      - MODEL_CACHE=/models
      # 4GB-GPU memory policy (see embedder/ml gpu_slot.py + GPU_MEMORY FLOWS):
      # embeddinggemma int8 (~310MB) runs CPU-only (EMBED_DEVICE=cpu in .env): its
      # 262k-vocab embed table dequantizes to ~805MB in one node and OOMs the capped
      # CUDA arena. GPU stays whisper/CLIP's.
      - EMBED_ONNX_FILE=${EMBED_ONNX_FILE:-onnx/model_quantized.onnx}
      - EMBED_GPU_MEM_LIMIT_MB=${EMBED_GPU_MEM_LIMIT_MB:-1800}
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-16}
      - EMBED_DEVICE=${EMBED_DEVICE:-auto}
      - DATABASE_URL=postgresql://obsidian:${POSTGRES_PASSWORD:-obsidian}@postgres:5432/obsidian
      - VAULT_DIR=/vault
      - AGENT_REPORTS_DIR=/reports
      - MCP_API_TOKEN=${MCP_API_TOKEN:?set MCP_API_TOKEN in .env}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - WRAPPER_URL=${WRAPPER_URL:-http://host.docker.internal:5001}
      - SYNTH_MODEL=${SYNTH_MODEL:-haiku}
      # v2 ingest (block-anchored, TOC-aware chaptering + sub-page bbox). Was dark-launched
      # off; now on. Toggle via INGEST_V2 in .env (on/off).
      - INGEST_V2=${INGEST_V2:-off}
      - WHISPER_MODEL=${WHISPER_MODEL:-distil-large-v3}
      - DOWNLOAD_DIR=/workspace
      - RESOURCE_DIR=/resources
      # Escalation agent (AGENT_ESCALATION.md) — off unless set to 1. Fix-log lands in
      # AGENT_FIXES_DIR (defaults to /reports = the mounted _reports/).
      - AGENT_ESCALATION_ENABLED=${AGENT_ESCALATION_ENABLED:-0}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8084}
    # Native Linux Docker doesn't provide host.docker.internal (only Docker
    # Desktop does). Map it to the host gateway so the embedder can reach the
    # host-wrapper (WRAPPER_URL) running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Hard CPU ceiling: whisper/CLIP/embedding can use at most 3 cores, so
          # they physically cannot drown the host UI. CPU throttle only SLOWS work
          # (no crash) — exactly the throughput-for-calm trade we want. No memory
          # limit on purpose (caps OOM-kill; the .git fix + swap handle memory).
          cpus: "3"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # First start downloads ~669MB of fp16 ONNX weights (onnx/model_fp16.onnx)
      # into the /models volume — a few minutes at typical Hub speeds. Failures
      # inside start_period don't count, so the backend's service_healthy wait
      # won't abort the stack mid-download. Cached after the first run → fast.
      start_period: 600s

  backend:
    build: ./obsidian_optimizer/obsidian
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8084"   # loopback only — kept for vite dev proxy; browsers go through nginx
    environment:
      - VAULT_PATH=/vault
      - IMAGE_PATH=/vault/resources/images
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/obsidian
      - SPRING_DATASOURCE_USERNAME=obsidian
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-obsidian}
      - APP_AUTH_USERNAME=${APP_AUTH_USERNAME:-admin}
      - CARDS_ENABLED=${CARDS_ENABLED:-true}
      - CARDS_BATCH_LIMIT=${CARDS_BATCH_LIMIT:-5}   # gentler: fewer card-gen jobs per pass
      # Quiet-mode toggles (all default true). Set false in .env to boot the app
      # LIGHT — web/API/search/MCP only, zero background processing — for testing.
      - EMBEDDING_ENABLED=${EMBEDDING_ENABLED:-true}
      # Spring relaxed-binds these to embedding.batch-limit / embedding.scan.delay-ms.
      # Raise for a fast backlog drain (local ONNX, no API cost); defaults are 8 / 3600000.
      # The scan is now the SAFETY NET, not the primary trigger — the outbox+RabbitMQ path
      # (ImageScanService's chokepoint) delivers new work within seconds instead of waiting
      # for this tick (see QUEUE_UNIFICATION_PLAN.md Phase 3).
      - EMBEDDING_BATCH_LIMIT=${EMBEDDING_BATCH_LIMIT:-8}
      - EMBEDDING_SCAN_DELAY_MS=${EMBEDDING_SCAN_DELAY_MS:-3600000}
      # RabbitMQ — internal service name, no host port published (see the rabbitmq service
      # above). guest/guest default is fine: nothing outside the compose network can reach it.
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      # Off by default in application.properties (so test contexts without a broker
      # don't fail startup) — the real app has a broker, so turn consumption on here.
      - RABBITMQ_LISTENERS_AUTO_START=${RABBITMQ_LISTENERS_AUTO_START:-true}
      - IMAGES_ENABLED=${IMAGES_ENABLED:-true}
      - CHRONO_ENABLED=${CHRONO_ENABLED:-true}
      - INGEST_ENABLED=${INGEST_ENABLED:-true}
      - APP_AUTH_PASSWORD=${APP_AUTH_PASSWORD:?set APP_AUTH_PASSWORD in .env}
      # Stable remember-me signing key — MUST persist across restarts (random default in Spring
      # would log everyone out on each boot). Set APP_AUTH_REMEMBER_KEY in .env to a long random
      # string; the fallback keeps local/dev booting.
      - APP_AUTH_REMEMBER_KEY=${APP_AUTH_REMEMBER_KEY:-obsopt-dev-remember-key-change-me}
      - EMBEDDER_URL=http://embedder:8000
      - WRAPPER_URL=${WRAPPER_URL:-http://host.docker.internal:5001}
      - IMAGE_WORKER_PARALLELISM=${IMAGE_WORKER_PARALLELISM:-4}
      - IMAGE_BATCH_SIZE=${IMAGE_BATCH_SIZE:-4}
      - SYNC_PASSPHRASE=${SYNC_PASSPHRASE:-}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID:-placeholder}
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON:-placeholder}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-}
      - SYNC_UPLOAD_CRON=${SYNC_UPLOAD_CRON:-0 0 */6 * * *}
      - SYNC_JANITOR_CRON=${SYNC_JANITOR_CRON:-0 0 4 * * SUN}
      # Parallel Drive uploads. Keep low (3-4): one Drive account 403-throttles sustained
      # bulk creates above that even with backoff. Retries per file before dead-lettering.
      - SYNC_UPLOAD_CONCURRENCY=${SYNC_UPLOAD_CONCURRENCY:-3}
      - SYNC_UPLOAD_MAX_RETRIES=${SYNC_UPLOAD_MAX_RETRIES:-5}
      # DB backup: nightly encrypted pg_dump → Drive _db/ (gated on auto-sync). Keep = rolling dumps retained.
      - SYNC_DBBACKUP_CRON=${SYNC_DBBACKUP_CRON:-0 0 3 * * *}
      - SYNC_DBBACKUP_KEEP=${SYNC_DBBACKUP_KEEP:-3}
      - MCP_API_TOKEN=${MCP_API_TOKEN:-}   # internal agent API token (embedder → backend)
      # Memory-tight host: G1 periodic GC uncommits idle heap back to the OS
      # (no hard -Xmx cap — caps risk OOM-kills; this just stops the JVM hoarding).
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseG1GC -XX:+UseStringDeduplication -XX:G1PeriodicGCInterval=300000 -XX:+G1PeriodicGCInvokesConcurrent
    # Native Linux Docker doesn't provide host.docker.internal (only Docker
    # Desktop does). Map it to the host gateway so the backend can reach the
    # host-wrapper (WRAPPER_URL) running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOST_VAULT_PATH}:/vault
    depends_on:
      postgres:
        condition: service_healthy
      embedder:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    # No host ports, no certs: the app is reachable ONLY through the Cloudflare
    # tunnel (cloudflared container → frontend:8081 over the docker network).
    # Cloudflare terminates real TLS at its edge. Nothing on localhost or the LAN.
    environment:
      # nginx envsubst injects this into the open /mcp proxy as the X-API-Key it
      # forwards to the embedder. FILTER pins substitution to this one var so
      # nginx's own $host/$uri/etc. survive templating. See frontend/nginx.conf.template.
      - MCP_API_TOKEN=${MCP_API_TOKEN:?set MCP_API_TOKEN in .env}
      # Agent-escalation WS token (nginx /agent-ws ?token= gate). Optional — blank disables the
      # route (its `if` never matches, so /agent-ws always 401s until you set a token).
      - AGENT_WS_TOKEN=${AGENT_WS_TOKEN:-}
      - NGINX_ENVSUBST_FILTER=(MCP_API_TOKEN|AGENT_WS_TOKEN)
    volumes:
      # nginx serves these vault subdirs directly (range-request support, zero JVM involvement).
      # Derived from HOST_VAULT_PATH — no separate env vars needed.
      - ${HOST_VAULT_PATH}/resources:/vault-resources:ro
      - ${HOST_VAULT_PATH}/_workspace:/workspace:ro
      # Signed Firefox .xpi + updates.json for self-hosted extension auto-update
      # (nginx /ext/ ← linux_scripts/deploy-extension.sh writes here). :ro — nginx
      # only reads; new versions appear live without recreating the container.
      - ./ext-dist:/ext-dist:ro
      # Desktop installer (.exe) served at nginx /download/ for the in-app "Get App" view.
      # Populated by the desktop build (linux_scripts publish or manual copy of
      # desktop/release/*.exe → downloads/). :ro, live without recreating the container.
      - ./downloads:/downloads:ro
    depends_on:
      - backend

  # Cloudflare Tunnel for self-hosting behind your own DNS.
  # Opt-in: docker compose --profile tunnel up
  # Setup: create the tunnel in Cloudflare Zero Trust → copy its token into
  # .env → point the tunnel's public hostname at http://frontend:8081.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - frontend

volumes:
  postgres_data:
  embedder_models:
  rabbitmq_data:
