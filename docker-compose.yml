services:
  postgres:
    build: ./db
    environment:
      POSTGRES_DB: obsidian
      POSTGRES_USER: obsidian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obsidian}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsidian"]
      interval: 5s
      timeout: 5s
      retries: 10

  embedder:
    build: ./embedder
    ports:
      - "8000:8000"
    volumes:
      - embedder_models:/models
    environment:
      - EMBED_MODEL=${EMBED_MODEL:-mixedbread-ai/mxbai-embed-large-v1}
      - MODEL_CACHE=/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s   # model download on first start can take a while

  backend:
    build: ./obsidian_optimizer/obsidian
    ports:
      - "8084:8084"
    environment:
      - VAULT_PATH=/vault
      - IMAGE_PATH=/vault/resources/images
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/obsidian
      - SPRING_DATASOURCE_USERNAME=obsidian
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-obsidian}
      - MCP_API_TOKEN=${MCP_API_TOKEN:-changeme}
      - EMBEDDER_URL=http://embedder:8000
    volumes:
      - ${HOST_VAULT_PATH}:/vault
    depends_on:
      postgres:
        condition: service_healthy
      embedder:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8083:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  embedder_models:
