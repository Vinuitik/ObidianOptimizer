services:
  postgres:
    build: ./db
    environment:
      POSTGRES_DB: obsidian
      POSTGRES_USER: obsidian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obsidian}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsidian"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build: ./obsidian_optimizer/obsidian
    ports:
      - "8084:8084"
    environment:
      - VAULT_PATH=/vault
      - IMAGE_PATH=/vault/resources/images
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/obsidian
      - SPRING_DATASOURCE_USERNAME=obsidian
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-obsidian}
      - MCP_API_TOKEN=${MCP_API_TOKEN:-changeme}
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ${HOST_VAULT_PATH}:/vault
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8083:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
